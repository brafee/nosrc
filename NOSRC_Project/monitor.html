<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOSRC | Tactical Live Monitor</title>
    <style>
        :root {
            --neon-green: #33ff33;
            --dark-bg: #020a02;
            --alert-red: #ff3333;
            --scan-line: rgba(51, 255, 51, 0.1);
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* 核心：全屏 CRT 扫描线和老旧屏幕闪烁 */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 1000;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            opacity: 0.6;
        }

        /* 屏幕整体呼吸效果 */
        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.95; }
            10% { opacity: 0.9; }
            15% { opacity: 1; }
            100% { opacity: 0.98; }
        }
        body { animation: flicker 0.1s infinite; }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            padding: 25px;
            flex-grow: 1;
            z-index: 1;
        }

        /* 监控大屏幕 - 增加 HUD 瞄准质感 */
        .monitor-frame {
            border: 1px solid var(--neon-green);
            position: relative;
            background: radial-gradient(circle, #0a1a0a 0%, #000 100%);
            overflow: hidden;
            box-shadow: inset 0 0 100px rgba(51, 255, 51, 0.1), 0 0 20px rgba(51, 255, 51, 0.2);
        }

        /* 屏幕边角 HUD */
        .monitor-frame::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 20px solid transparent;
            background: 
                linear-gradient(var(--neon-green), var(--neon-green)) left top,
                linear-gradient(var(--neon-green), var(--neon-green)) left top,
                linear-gradient(var(--neon-green), var(--neon-green)) right top,
                linear-gradient(var(--neon-green), var(--neon-green)) right top,
                linear-gradient(var(--neon-green), var(--neon-green)) left bottom,
                linear-gradient(var(--neon-green), var(--neon-green)) left bottom,
                linear-gradient(var(--neon-green), var(--neon-green)) right bottom,
                linear-gradient(var(--neon-green), var(--neon-green)) right bottom;
            background-repeat: no-repeat;
            background-size: 2px 30px, 30px 2px;
            opacity: 0.4;
            pointer-events: none;
        }

        /* 雷达层 */
        .radar-sweep {
            position: absolute;
            width: 250%; height: 250%;
            top: -75%; left: -75%;
            background: conic-gradient(from 0deg, rgba(51, 255, 51, 0.15) 0deg, transparent 90deg);
            animation: sweep 6s linear infinite;
            z-index: 3;
        }

        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 网格层 - 增加动态流动感 */
        .grid-layer {
            position: absolute;
            width: 100%; height: 100%;
            background-image: linear-gradient(rgba(51, 255, 51, 0.1) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(51, 255, 51, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
        }

        /* 信号 Ping 动画升级 */
        .ping {
            position: absolute;
            width: 8px; height: 8px;
            background: var(--alert-red);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--alert-red), 0 0 30px var(--alert-red);
            z-index: 10;
            transform: translate(-50%, -50%);
        }
        .ping::before {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            border: 1px solid var(--alert-red);
            border-radius: 50%;
            animation: ripple 2s ease-out infinite;
        }
        @keyframes ripple {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(6); opacity: 0; }
        }

        /* 右侧面板 */
        .side-panel { display: flex; flex-direction: column; gap: 20px; }
        
        .data-box {
            border: 1px solid var(--neon-green);
            background: rgba(0, 20, 0, 0.6);
            backdrop-filter: blur(5px);
            padding: 12px;
            position: relative;
        }
        
        .box-title {
            background: var(--neon-green);
            color: black;
            padding: 2px 8px;
            font-weight: bold;
            font-size: 0.75rem;
            margin-bottom: 12px;
            display: inline-block;
        }

        #log-stream {
            font-size: 0.65rem;
            height: 350px;
            overflow: hidden;
            line-height: 1.6;
            color: rgba(51, 255, 51, 0.8);
        }

        /* 进度条样式 */
        .stat-row { margin-bottom: 10px; }
        .bar-bg { width: 100%; height: 6px; background: #111; border: 1px solid var(--neon-green); margin-top: 4px; }
        .bar-fill { height: 100%; background: var(--neon-green); transition: width 0.3s; }

        .footer {
            border-top: 1px solid var(--neon-green);
            padding: 10px 25px;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            background: rgba(0, 10, 0, 0.9);
        }

        /* 各种文字装饰 */
        .decor-text { position: absolute; font-size: 0.6rem; opacity: 0.5; z-index: 5; }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="monitor-frame" id="monitor">
        <div class="grid-layer"></div>
        <div class="radar-sweep"></div>
        <div id="pings-layer"></div>

        <div class="decor-text" style="top: 10px; right: 10px;">REC ● AUTO</div>
        <div class="decor-text" style="bottom: 10px; left: 10px;">COORD_SYS: WGS-84</div>
        <div class="decor-text" style="bottom: 10px; right: 10px;">UPLINK_VER: 4.8.2</div>
        
        <div style="position: absolute; top: 25px; left: 25px; font-size: 0.75rem; z-index: 20; letter-spacing: 1px;">
            <span style="color: black; background: var(--neon-green); padding: 0 5px;">TACTICAL_MONITOR</span><br>
            <div style="margin-top: 8px;">
                STATUS: <span style="color: var(--neon-green)">SCANNING...</span><br>
                SECTOR: <span id="sector-id">ALPHA-09</span><br>
                THREAT: <span id="threat-level" style="color: var(--neon-green)">LOW</span>
            </div>
        </div>
    </div>

    <div class="side-panel">
        <div class="data-box">
            <div class="box-title">ANOMALY_STREAMS</div>
            <div id="log-stream"></div>
        </div>

        <div class="data-box">
            <div class="box-title">HARDWARE_LOAD</div>
            <div class="stat-row">
                <div style="font-size: 0.65rem; display: flex; justify-content: space-between;">
                    <span>CPU_PROC</span><span id="cpu-val">0%</span>
                </div>
                <div class="bar-bg"><div id="cpu-bar" class="bar-fill" style="width: 0%"></div></div>
            </div>
            <div class="stat-row">
                <div style="font-size: 0.65rem; display: flex; justify-content: space-between;">
                    <span>MEM_ALLOC</span><span>88%</span>
                </div>
                <div class="bar-bg"><div class="bar-fill" style="width: 88%"></div></div>
            </div>
        </div>

        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
            <a href="index.html" class="nav-item" style="text-decoration: none; color: black; background: var(--neon-green); text-align: center; font-size: 0.8rem; padding: 10px; font-weight: bold;">[TERMINATE_UPLINK]</a>
        </div>
    </div>
</div>

<footer class="footer">
    <div>LOGIN: <span style="color: white;">NOSRC_STAFF_#7729</span></div>
    <div>SENSORS: [||||||||||] 100%</div>
    <div id="clock">00:00:00</div>
</footer>

<script>
    // 1. 更加动态的日志系统
    const logMessages = [
        "Slight tremor detected in Sector 4.",
        "Unknown signal burst at 14.5Hz.",
        "Satellite-09 sync re-established.",
        "Thermal deviation in Site-07 containment.",
        "Encrypted packet received from O5-COUNCIL.",
        "Magnetic field fluctuation: +0.45μT.",
        "Deep scan: No bio-signatures found.",
        "Background radiation levels: NOMINAL.",
        "Accessing subterranean sensor array...",
        "Data packet fragmented at NODE_7."
    ];

    function updateLogs() {
        const stream = document.getElementById('log-stream');
        const entry = document.createElement('div');
        entry.style.marginBottom = "8px";
        const time = new Date().toLocaleTimeString('en-GB');
        entry.innerHTML = `<span style="opacity:0.4;">[${time}]</span> <span style="color:white;">></span> ${logMessages[Math.floor(Math.random()*logMessages.length)]}`;
        stream.prepend(entry);
        if(stream.children.length > 18) stream.lastChild.remove();
    }

    // 2. 信号点生成 + 威胁等级联动
    function createPing() {
        const layer = document.getElementById('pings-layer');
        const ping = document.createElement('div');
        ping.className = 'ping';
        const x = Math.random() * 90 + 5;
        const y = Math.random() * 90 + 5;
        ping.style.top = y + '%';
        ping.style.left = x + '%';
        layer.appendChild(ping);
        
        // 联动威胁等级
        const threat = document.getElementById('threat-level');
        threat.innerText = "ELEVATED";
        threat.style.color = "var(--alert-red)";
        
        setTimeout(() => {
            ping.remove();
            if(layer.children.length === 0) {
                threat.innerText = "LOW";
                threat.style.color = "var(--neon-green)";
            }
        }, 4000);
    }

    // 3. 硬件数据随机波动
    function updateStats() {
        const cpu = Math.floor(20 + Math.random() * 30);
        document.getElementById('cpu-val').innerText = cpu + "%";
        document.getElementById('cpu-bar').style.width = cpu + "%";
        
        const sectors = ["ALPHA-09", "BETA-02", "GAMMA-12", "SIGMA-04"];
        document.getElementById('sector-id').innerText = sectors[Math.floor(Math.random()*sectors.length)];
    }

    // 4. 屏幕偶发闪烁 (Glitch 效果)
    function randomGlitch() {
        const mon = document.getElementById('monitor');
        if(Math.random() > 0.95) {
            mon.style.filter = "invert(1) hue-rotate(90deg)";
            setTimeout(() => mon.style.filter = "none", 50);
        }
    }

    // 5. 时钟
    function updateClock() {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB');
    }

    // 定时器
    setInterval(updateLogs, 2000);
    setInterval(createPing, 5000);
    setInterval(updateStats, 1500);
    setInterval(updateClock, 1000);
    setInterval(randomGlitch, 100);
    
    // 初始化
    updateClock();
    updateStats();
</script>

</body>
</html>
